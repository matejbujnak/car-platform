server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-origin deployment: API requests are proxied to the backend,
    # so the browser never talks to another host. The container name is used
    # instead of the service name - the network is shared with other projects
    # and generic names like "backend" would be ambiguous there.
    location /api/ {
        proxy_pass http://car-platform-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Share pages (/car/<id>) carry Open Graph metadata for link previews
    # and are rendered by the backend, which injects it into the SPA shell.
    location /car/ {
        proxy_pass http://car-platform-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change under the same name - cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app (client-side routing).
    # The HTML shell must always be revalidated, otherwise browsers keep an
    # old index.html (heuristic caching) that points to the previous build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
